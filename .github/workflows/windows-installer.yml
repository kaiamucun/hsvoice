name: Build Windows Installer

# 起動方法:
#   - win-v1.0.0 のようなタグをpushすると自動起動
#   - GitHubのActionsタブから手動起動(Run workflow)も可能
on:
  push:
    tags: ['win-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン (例: 1.0.0)'
        default: '1.0.0'

permissions:
  contents: write   # Releasesへのアップロードに必要

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: バージョン決定
        id: ver
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}' -replace '^win-v', ''
          } else { '${{ inputs.version }}' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: テスト実行
        continue-on-error: true
        run: dotnet test tests/HSVoice.Core.Tests 2>&1 | Tee-Object ../log-test.txt

      - name: WiXインストール
        run: |
          dotnet tool install --global wix --version 5.0.2 2>&1 | Tee-Object ../log-wix-install.txt
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: whisperモデルをダウンロード
        run: ./scripts/download-model.ps1 2>&1 | Tee-Object ../log-model.txt

      - name: publish (self-contained win-x64)
        run: |
          dotnet publish src/HSVoice.App -c Release -r win-x64 --self-contained `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o dist/publish-x64 2>&1 | Tee-Object ../log-publish.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: モデルを同梱
        run: |
          New-Item -ItemType Directory -Force dist/publish-x64/models | Out-Null
          Copy-Item models/ggml-*.bin dist/publish-x64/models/
          Get-ChildItem dist/publish-x64/models

      - name: MSIビルド
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Force "release/HSVoice-$v" | Out-Null
          $pub = (Resolve-Path dist/publish-x64).Path
          wix build Packaging/Package.wxs -arch x64 `
            -d "ProductVersion=$v" -d "PublishDir=$pub" `
            -o "release/HSVoice-$v/HSVoice-Installer-$v-x64.msi" 2>&1 | Tee-Object ../log-msi.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item "release/HSVoice-$v/HSVoice-Installer-$v-x64.msi"

      - name: Releaseを作成しMSIをアップロード
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $msi = "release/HSVoice-$v/HSVoice-Installer-$v-x64.msi"
          $size = "{0:N0} MB" -f ((Get-Item $msi).Length / 1MB)
          gh release create "win-v$v" `
            --title "HS Voice for Windows v$v" `
            --notes "Windows版MSIインストーラ(音声認識モデル同梱・$size)。社内配布用。" `
            $msi --repo ${{ github.repository }} 2>&1 | Tee-Object ../log-release.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 失敗ログをサマリーに表示
        if: failure()
        working-directory: .
        run: |
          $last = Get-ChildItem log-*.txt -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($last) {
            foreach ($line in (Get-Content $last -Tail 10)) { Write-Output "::error::[$($last.Name)] $line" }
          }
          "## ビルド失敗ログ(各工程の末尾)" >> $env:GITHUB_STEP_SUMMARY
          foreach ($f in Get-ChildItem log-*.txt -ErrorAction SilentlyContinue) {
            "### $($f.Name)" >> $env:GITHUB_STEP_SUMMARY
            '```'           >> $env:GITHUB_STEP_SUMMARY
            Get-Content $f -Tail 60 >> $env:GITHUB_STEP_SUMMARY
            '```'           >> $env:GITHUB_STEP_SUMMARY
          }
