<body>
  <h1>HS Voice をインストール</h1>
  <p class="lead">HS Voiceは、ショートカットを押して話すだけで、メール、チャット、文書などへ文字を入力できる社内向けmacOSアプリです。</p>
  <p>このインストーラは、Apple SiliconとIntelの両方に対応したHS Voiceを「アプリケーション」フォルダへインストールします。</p>
  <div class="note">「続ける」をクリックし、画面の案内に従ってインストールしてください。</div>
